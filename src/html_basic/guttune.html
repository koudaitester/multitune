<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GutTune | 肠道状态自测</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 32px 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            color: #222;
            font-size: 26px;
            font-weight: 600;
        }
        .header p {
            margin-top: 8px;
            color: #666;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 24px;
            margin-bottom: 20px;
        }
        .upload-area {
            border: 2px dashed #c9d2dc;
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-area:hover {
            border-color: #6b8caf;
        }
        .upload-area input {
            display: none;
        }
        .preview-wrap {
            margin-top: 20px;
            text-align: center;
        }
        #preview {
            max-height: 280px;
            border-radius: 10px;
        }
        .b64-block {
            margin-top: 20px;
        }
        .b64-block label {
            display:block;
            color:#444;
            margin-bottom:6px;
            font-weight:500;
        }
        #b64Output {
            width:100%;
            height:120px;
            padding:10px;
            border:1px solid #ddd;
            border-radius:8px;
            font-family: monospace;
            font-size:12px;
            resize:none;
        }
        .btn-wrap {
            margin-top:20px;
            text-align:center;
        }
        #submitBtn {
            background-color:#3b72b8;
            color:#fff;
            border:none;
            border-radius:10px;
            padding:12px 28px;
            font-size:16px;
            cursor:pointer;
            transition: background 0.2s;
        }
        #submitBtn:hover {
            background-color:#2d5990;
        }
        .result-card {
            margin-top:24px;
            background:#f8fafc;
            border-radius:12px;
            padding:20px;
        }
        .result-card h3 {
            color:#222;
            margin-bottom:12px;
        }
        .result-item{
            margin:10px 0;
            line-height:1.7;
        }
        .label{
            font-weight:600;
            color:#3b72b8;
        }
        .tip-text {
            margin-top:16px;
            font-size:13px;
            color:#777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GutTune 肠道状态自测</h1>
            <p>拍照上传，自动评估布里斯托分型，对照你的基准样本</p>
        </div>

        <div class="card">
            <div class="upload-area" id="uploadClick">
                <p>📷 点击此处选择图片 / 使用摄像头拍摄</p>
                <input type="file" id="fileInput" accept="image/*" capture="environment">
            </div>
            <div class="preview-wrap">
                <img id="preview" />
            </div>
            <div class="b64-block">
                <label>Base64 编码（调试用）</label>
                <textarea id="b64Output" readonly></textarea>
            </div>
            <div class="btn-wrap">
                <button id="submitBtn">提交评估</button>
            </div>
        </div>

        <div class="card result-card">
            <h3>评估结果</h3>
            <div id="resultBox">等待上传图片并提交...</div>
            <div class="tip-text">
                💡提示：自然光拍摄，尽量保持画面清晰；不要开启美颜/图像增强，避免干扰分型判断。
            </div>
        </div>
    </div>

<script>
const fileInput = document.getElementById("fileInput");
const uploadClick = document.getElementById("uploadClick");
const preview = document.getElementById("preview");
const b64Output = document.getElementById("b64Output");
const submitBtn = document.getElementById("submitBtn");
const resultBox = document.getElementById("resultBox");

let b64Str = "";

uploadClick.onclick = () => {
  fileInput.click();
}

fileInput.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.src = ev.target.result;
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxSide = 720;
      let w = img.width;
      let h = img.height;
      if (w > maxSide || h > maxSide) {
        if (w > h) {
          h = (h * maxSide) / w;
          w = maxSide;
        } else {
          w = (w * maxSide) / h;
          h = maxSide;
        }
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      // jpeg质量压低
      const dataUrl = canvas.toDataURL("image/jpeg", 0.65);
      preview.src = dataUrl;
      const rawB64 = dataUrl.split(',')[1];
      // 清除所有空白字符
      b64Str = rawB64.replace(/[\n\r\s]/g, '');
      b64Output.value = b64Str;
      resultBox.innerHTML = "<div class='result-item'>图片已加载，可提交评估</div>";
    }
  };
  reader.readAsDataURL(file);
}

submitBtn.onclick = async () => {
  if (!b64Str) {
    resultBox.innerHTML = "<div class='result-item'>⚠️ 请先选择图片</div>";
    return;
  }
  resultBox.innerHTML = "<div class='result-item'>🔍 分析中，请稍候...</div>";
  try {
    const res = await fetch("/api/v1/tune/gut", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image_b64: b64Str })
    })
    const data = await res.json();
    resultBox.innerHTML = `
            <div class="result-item"><span class="label">分型：</span>${data.type_name}</div>
            <div class="result-item"><span class="label">状态等级：</span>${data.level}（${data.tag}）</div>
            <div class="result-item"><span class="label">形态描述：</span>${data.description}</div>
            <div class="result-item"><span class="label">建议：</span>${data.suggestion}</div>
            <div class="result-item"><span class="label">基准对比：</span>${data.compare_baseline}</div>
        `
  } catch (err) {
    resultBox.innerHTML = `<div class='result-item'>❌ 请求失败：${err}</div>`
  }
}
</script>
</body>
</html>
