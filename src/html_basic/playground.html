<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multitune · 视觉服务控制台</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --ink:#1c2024; --muted:#6b7280;
    --live:#0f766e; --live-bg:#e6f4f1; --inert:#0e6a97; --inert-bg:#e8f2f9;
    --ok:#15803d; --warn:#a16207; --mid:#c2410c; --bad:#b91c1c; --dim:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    padding:26px 28px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .top h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
  .top .sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
  .conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
    padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fafbfc;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#c9ced6}
  .dot.on{background:var(--ok)}
  .dot.off{background:var(--bad)}

  main{padding:24px 28px 40px;max-width:1180px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
  .svc{position:relative;text-align:left;cursor:pointer;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:14px 15px 13px;
    transition:border-color .15s,box-shadow .15s,transform .15s;font:inherit;color:inherit}
  .svc:hover{border-color:#c8ced7;box-shadow:0 2px 10px rgba(20,25,35,.06)}
  .svc.active{border-color:var(--live);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
  .svc h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
  .svc .hint{margin:0;color:var(--muted);font-size:12px;line-height:1.5;min-height:36px}
  .svc .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;
    letter-spacing:.02em}
  .badge.live{color:var(--live);background:var(--live-bg)}
  .badge.inert{color:var(--inert);background:var(--inert-bg)}
  .badge.stub{color:#8a5a00;background:#fdf3e2}
  .pathline{font:11.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;color:#9aa1ac;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .panel{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .panel[hidden]{display:none}
  .phead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
    background:#fbfcfd}
  .phead h2{margin:0;font-size:15px;font-weight:600}
  .phead .p{font:11.5px/1 ui-monospace,Menlo,monospace;color:#98a0aa}
  .phead .spacer{flex:1}
  .pbody{display:grid;grid-template-columns:300px 1fr;gap:0}
  @media (max-width:820px){.pbody{grid-template-columns:1fr}}
  .left{padding:18px;border-right:1px solid var(--line)}
  @media (max-width:820px){.left{border-right:0;border-bottom:1px solid var(--line)}}
  .right{padding:18px;min-height:240px}

  .drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    height:150px;border:1.5px dashed #cfd5dd;border-radius:10px;color:var(--muted);
    cursor:pointer;background:#fafbfc;transition:border-color .15s,background .15s;overflow:hidden}
  .drop:hover,.drop.over{border-color:var(--live);background:#f2faf8}
  .drop img{max-width:100%;max-height:100%;object-fit:contain}
  .field{margin-top:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input[type=text]{width:100%;padding:7px 10px;font:inherit;font-size:13px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:inherit}
  input[type=text]:focus{outline:0;border-color:var(--live);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
  .btns{display:flex;gap:8px;margin-top:16px}
  button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid transparent;
    transition:background .15s,border-color .15s,opacity .15s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--live);color:#fff;font-weight:600;flex:1}
  .primary:not(:disabled):hover{background:#0c665f}
  .ghost{background:#fff;border-color:var(--line);color:var(--muted)}
  .ghost:hover{border-color:#c8ced7;color:var(--ink)}
  .mini{background:#fff;border-color:var(--line);color:var(--muted);padding:5px 10px;font-size:12px}

  .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
  .meta .pill{padding:3px 9px;border-radius:6px;background:#f2f4f7;border:1px solid var(--line)}
  .meta .pill.ok{color:var(--ok);background:#eefaf1;border-color:#cfe9d7}
  .meta .pill.err{color:var(--bad);background:#fdefef;border-color:#f0cdcd}
  .muted{color:var(--muted)}
  .empty{color:#9aa1ac;font-size:13px;padding:26px 0;text-align:center}

  .score{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .score b{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .score span{font-size:12px;color:var(--muted)}
  .score .lvl{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
  .kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #eceff3;font-size:13px}
  .kv>span:first-child{color:var(--muted);min-width:72px}
  .kv b{font-weight:600}
  .block{margin-top:13px}
  .block h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .block p{margin:0;font-size:13.5px}
  .block.warn h4{color:var(--bad)}
  ul.plain{margin:4px 0 0;padding-left:17px}
  ul.plain li{margin:2px 0;font-size:13px}
  table.issues{width:100%;border-collapse:collapse;margin-top:5px;font-size:13px}
  table.issues th,table.issues td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.issues th{font-size:11.5px;color:var(--muted);font-weight:600}
  .invalid-bar{display:flex;gap:7px;align-items:center;padding:9px 12px;margin-bottom:15px;
    background:#fdf3e2;border:1px solid #f0dcae;border-radius:8px;color:#8a5a00;font-size:13px}
  .invalid-bar b{font-weight:600}
  details{margin-top:16px}
  details summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
  pre{margin:8px 0 0;padding:12px;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;
    font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:340px}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>Multitune 视觉服务控制台</h1>
    <p class="sub">8 个视觉评估插件 · 上传图片直接调用本地接口</p>
  </div>
  <div class="conn"><span id="dot" class="dot"></span><span id="connText">检测中…</span></div>
</div>

<main>
  <section class="grid" id="grid"></section>

  <section class="panel" id="panel" hidden>
    <div class="phead">
      <h2 id="pName">—</h2>
      <span class="p" id="pPath"></span>
      <span class="spacer"></span>
      <button class="mini" id="closeBtn">收起</button>
    </div>
    <div class="pbody">
      <div class="left">
        <div class="drop" id="drop">
          <span id="dropText">点击或拖入图片</span>
          <img id="preview" alt="" hidden>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="field" id="tagWrap" hidden>
          <label for="tag">备注 tag（可选，会拼进提示词上下文）</label>
          <input type="text" id="tag" placeholder="例如：叶片发黄第 3 天">
        </div>
        <div class="btns">
          <button class="primary" id="runBtn" disabled>调用接口</button>
          <button class="ghost" id="clearBtn">清空</button>
        </div>
      </div>
      <div class="right">
        <div class="meta" id="meta"></div>
        <div id="result"><p class="empty">选一张图，点「调用接口」</p></div>
        <details id="rawWrap" hidden><summary>原始 JSON</summary><pre id="raw"></pre></details>
      </div>
    </div>
  </section>
</main>

<script>
const SERVICES = [
  { key:'plant', name:'植物调校', domain:'live', path:'/api/v1/tune/plant', inKey:'img_b64', tag:true,
    hint:'叶片长势、病斑、缺水缺光判断与养护建议' },
  { key:'pet', name:'宠物调校', domain:'live', path:'/api/v1/tune/pet', inKey:'img_b64', tag:true,
    hint:'体型、毛发、精神状态识别与喂养建议' },
  { key:'fruit', name:'水果分选', domain:'live', path:'/api/v1/tune/fruit', inKey:'image_b64', tag:true,
    hint:'成熟度分级与食用时机建议' },
  { key:'gut', name:'便便分型', domain:'live', path:'/api/v1/tune/gut', inKey:'image_b64', tag:false,
    hint:'布里斯托分型判定与基准对比' },
  { key:'cloth', name:'织物品质', domain:'inert', path:'/api/v1/good/cloth', inKey:'image_b64', tag:true, stub:true,
    hint:'洁净度、完整度、污渍判断' },
  { key:'goodwall', name:'墙面品质', domain:'inert', path:'/api/v1/good/goodwall', inKey:'image_b64', tag:true, stub:true,
    hint:'裂缝、污渍、空鼓、涂层完整性' },
  { key:'oldman', name:'适老空间', domain:'inert', path:'/api/v1/good/oldman', inKey:'image_b64', tag:false, stub:true,
    hint:'风险区域 + 毫米波/摄像头/按钮布点方案' },
  { key:'env', name:'环境监测', domain:'inert', path:'/api/v1/good/env', inKey:'image_b64', tag:false,
    hint:'室内舒适度评分、异常指标与传感器布点' },
];

const el = id => document.getElementById(id);
let cur = null, fileData = null;

/* 连通性 */
fetch('/openapi.json').then(r => {
  if (!r.ok) throw 0;
  return r.json();
}).then(o => {
  el('dot').className = 'dot on';
  el('connText').textContent = '接口在线 · ' + Object.keys(o.paths).length + ' 个路径';
}).catch(() => {
  el('dot').className = 'dot off';
  el('connText').textContent = '接口不可达';
});

/* 卡片列表 */
const grid = el('grid');
SERVICES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'svc';
  b.dataset.key = s.key;
  b.innerHTML =
    '<h3>' + esc(s.name) + '</h3>' +
    '<p class="hint">' + esc(s.hint) + '</p>' +
    '<div class="foot">' +
      '<span class="badge ' + (s.domain === 'live' ? 'live' : 'inert') + '">' +
        (s.domain === 'live' ? '活体' : '无生命') + '</span>' +
      (s.stub ? '<span class="badge stub">硬编码直通</span>' : '<span class="pathline">' + esc(s.path) + '</span>') +
    '</div>';
  b.onclick = () => open(s.key);
  grid.appendChild(b);
});

function open(key){
  cur = SERVICES.find(s => s.key === key);
  document.querySelectorAll('.svc').forEach(n => n.classList.toggle('active', n.dataset.key === key));
  el('panel').hidden = false;
  el('pName').textContent = cur.name;
  el('pPath').textContent = cur.path + '  ·  入参字段 ' + cur.inKey;
  el('tagWrap').hidden = !cur.tag;
  el('tag').value = '';
  clearImg();
  el('meta').innerHTML = '';
  el('result').innerHTML = '<p class="empty">选一张图，点「调用接口」</p>';
  el('rawWrap').hidden = true;
  el('panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* 图片选择 */
const drop = el('drop'), fileInput = el('file'), preview = el('preview'), dropText = el('dropText');
// 只在这里触发一次选择框：容器是 div（不是 label），input 也不在容器内，
// 不会出现「label 默认行为 + 手动 click」双弹导致选完又弹、照片丢失
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
};
fileInput.onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

function loadFile(f){
  if (!f.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    fileData = url.split(',')[1];
    preview.src = url;
    preview.hidden = false;
    dropText.hidden = true;
    el('runBtn').disabled = false;
  };
  reader.readAsDataURL(f);
}

function clearImg(){
  fileData = null;
  fileInput.value = '';
  preview.hidden = true;
  preview.removeAttribute('src');
  dropText.hidden = false;
  el('runBtn').disabled = true;
}

el('clearBtn').onclick = () => {
  clearImg();
  el('meta').innerHTML = '';
  el('result').innerHTML = '<p class="empty">选一张图，点「调用接口」</p>';
  el('rawWrap').hidden = true;
};
el('closeBtn').onclick = () => {
  el('panel').hidden = true;
  document.querySelectorAll('.svc').forEach(n => n.classList.remove('active'));
};

/* 调用 */
el('runBtn').onclick = async () => {
  if (!cur || !fileData) return;
  const body = {};
  body[cur.inKey] = fileData;
  if (cur.tag) body.tag = el('tag').value.trim();

  el('runBtn').disabled = true;
  el('runBtn').textContent = '调用中…';
  el('meta').innerHTML = '';
  el('result').innerHTML = '<p class="empty">等待模型响应…</p>';

  const t0 = performance.now();
  try {
    const res = await fetch(cur.path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const ms = Math.round(performance.now() - t0);
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch { data = { _raw: txt }; }

    el('meta').innerHTML =
      '<span class="pill ' + (res.ok ? 'ok' : 'err') + '">HTTP ' + res.status + '</span>' +
      '<span class="pill">' + ms + ' ms</span>' +
      '<span class="pill">' + (fileData.length / 1024).toFixed(0) + ' KB base64</span>';

    if (res.ok) {
      el('result').innerHTML = render(cur.key, data);
      el('raw').textContent = JSON.stringify(data, null, 2);
      el('rawWrap').hidden = false;
    } else {
      el('result').innerHTML =
        '<div class="block warn"><h4>调用失败</h4><p>' +
        esc(data.detail || data._raw || '未知错误') + '</p></div>';
      el('raw').textContent = txt;
      el('rawWrap').hidden = false;
    }
  } catch (e) {
    el('meta').innerHTML = '<span class="pill err">请求异常</span>';
    el('result').innerHTML = '<div class="block warn"><h4>请求异常</h4><p>' + esc(e.message) + '</p></div>';
  } finally {
    el('runBtn').disabled = false;
    el('runBtn').textContent = '调用接口';
  }
};

/* 结果渲染 */
function render(key, d){
  const head = d.status === 'invalid'
    ? '<div class="invalid-bar">⚠ <span><b>无效结论</b> · ' + esc(d.reason || '未识别到目标对象') +
      '，本次结果不可用</span></div>'
    : '';
  switch (key) {
    case 'gut': return head + renderGut(d);
    case 'oldman': return head + renderOldman(d);
    case 'env': return head + renderEnv(d);
    default: return head + renderGeneric(d);
  }
}

function renderGeneric(d){
  return '<div class="kv"><span>类型</span><b>' + esc(d.type_id ?? '—') + '</b></div>' +
    block('描述', d.desc) + block('建议', d.advice) +
    (d.warning ? '<div class="block warn"><h4>注意</h4><p>' + esc(d.warning) + '</p></div>' : '');
}

function renderGut(d){
  return '<div class="kv"><span>分型</span><b>' + esc(d.type_name) + '（' + esc(d.type_id) + ' 型）</b></div>' +
    '<div class="kv"><span>等级</span><b>' + esc(d.level) + '</b></div>' +
    block('描述', d.description) + block('建议', d.suggestion) + block('与基准对比', d.compare_baseline);
}

function renderOldman(d){
  return '<div class="score"><b style="color:' + scoreColor(d.layout_score) + '">' + esc(d.layout_score) +
      '</b><span>布局分 / 100</span></div>' +
    '<div class="kv"><span>空间类型</span><b>' + esc(d.space_type) + '</b></div>' +
    list('风险区域', d.risk_area_list, x => x.area_name + ' · ' + x.risk_level + ' · ' + x.note) +
    list('毫米波雷达布点', d.mmwave_sensor, x => x.suggest_pos + ' · 高 ' + x.install_height + ' · ' + x.angle + ' · 遮挡 ' + x.block_risk) +
    list('摄像头布点', d.camera_sensor, x => x.suggest_pos + ' · 高 ' + x.install_height + ' · ' + x.angle + ' · 光照 ' + x.light_risk) +
    list('紧急按钮', d.panic_button, x => x.suggest_pos + ' · ' + x.note) +
    list('盲区', d.blind_zone, x => x) +
    list('改进建议', d.improve_suggest, x => x);
}

function renderEnv(d){
  const lvlBg = { '优':'#eefaf1', '良':'#fdf8e7', '一般':'#fdeee4', '差':'#fdeded', '无效':'#f2f4f7' }[d.env_level] || '#f2f4f7';
  const lvlColor = { '优':'var(--ok)', '良':'var(--warn)', '一般':'var(--mid)', '差':'var(--bad)', '无效':'var(--dim)' }[d.env_level] || 'var(--dim)';
  let h = '<div class="score"><b style="color:' + scoreColor(d.comfort_score) + '">' + esc(d.comfort_score) + '</b>' +
    '<span class="lvl" style="color:' + lvlColor + ';background:' + lvlBg + '">' + esc(d.env_level) + '</span>' +
    '<span>舒适度 / 100</span></div>' +
    '<div class="kv"><span>场景</span><b>' + esc(d.scene_type) + '</b></div>';

  if (d.issues && d.issues.length) {
    h += '<div class="block"><h4>异常指标 · ' + d.issues.length + '</h4><table class="issues">' +
      '<tr><th>指标</th><th>方向</th><th>说明</th></tr>';
    d.issues.forEach(i => {
      h += '<tr><td>' + esc(i.item) + '</td><td>' + esc(i.level) + '</td><td class="muted">' + esc(i.note) + '</td></tr>';
    });
    h += '</table></div>';
  } else {
    h += '<div class="block"><h4>异常指标 · 0</h4><p class="muted">未检出异常</p></div>';
  }
  h += list('建议', d.suggestions, x => x) + list('传感器布点', d.monitor_points, x => x);
  return h;
}

/* 工具 */
function block(title, text){
  if (!text) return '';
  return '<div class="block"><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p></div>';
}
function list(title, arr, fn){
  if (!arr || !arr.length) return '';
  return '<div class="block"><h4>' + esc(title) + ' · ' + arr.length + '</h4><ul class="plain">' +
    arr.map(x => '<li>' + esc(fn(x)) + '</li>').join('') + '</ul></div>';
}
function scoreColor(n){
  if (n >= 90) return 'var(--ok)';
  if (n >= 75) return 'var(--warn)';
  if (n >= 60) return 'var(--mid)';
  return 'var(--bad)';
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
